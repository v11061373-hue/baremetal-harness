name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --extra dev --python 3.12

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      # Everything below runs without an API key, so CI never spends money.
      - name: Offline acceptance
        run: bash scripts/smoke_offline.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # A clean install catches imports that only resolve from the source tree.
      - name: Build and install from the wheel
        run: |
          uv build
          uv venv /tmp/wheel-check
          VIRTUAL_ENV=/tmp/wheel-check uv pip install dist/*.whl
          /tmp/wheel-check/bin/python -c "import baremetal_harness, baremetal_harness.app; print(baremetal_harness.__name__)"
          /tmp/wheel-check/bin/baremetal-harness --help
